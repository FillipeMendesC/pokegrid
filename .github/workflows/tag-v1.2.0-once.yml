name: Create v1.2.0 tag once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-v1.2.0-once.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/v1.2.0" >/dev/null 2>&1; then
            echo "v1.2.0 already exists."
            exit 0
          fi
          RELEASE_SHA="$(git rev-parse HEAD^)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.2.0 "$RELEASE_SHA" -m "POKÉGRID v1.2.0"
          git push origin v1.2.0
