name: Publish POKÉGRID v1.3.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.3.0.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
      - name: Verify update metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "release/latest.yml")) { throw "latest.yml was not generated" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/POKEGRID-Setup-*.exe
            release/POKEGRID-Portable-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:linux
      - name: Verify update metadata
        run: test -f release/latest-linux.yml
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/POKEGRID-*.AppImage
            release/latest-linux.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          target_commitish: main
          name: POKÉGRID v1.3.0
          prerelease: false
          draft: false
          body: |
            POKÉGRID v1.3.0 expands the field research system into a more complete local desktop application.

            ### New
            - Favorites archive
            - Saved Team Lab lineups
            - Move Lab with selected-move coverage, STAB and damage-class analysis
            - Generation archive and type/generation filters
            - About/System page
            - Optional interface sounds
            - Installed-build automatic update channel
            - Better English / Português (Brasil) coverage

            ### Fixed
            - Mega, Gigantamax and other alternate forms now resolve their base species correctly
            - Natural searches such as "mega charizard" now resolve form results
            - Generation browsing no longer leaks state back into the main index

            ### Windows
            Use **POKEGRID-Portable-1.3.0-x64.exe** for a no-install build.
            Use **POKEGRID-Setup-1.3.0-x64.exe** for the installed build with automatic update support.

            No VS Code, Node.js or npm is required for packaged builds.
          files: artifacts/*
