name: Bundle Windows Portable with Git LFS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bundle-windows-lfs.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs track "downloads/*.exe"

      - name: Download Windows Portable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh release download v1.2.0 \
            --pattern "POKEGRID-Portable-1.2.0-x64.exe" \
            --dir downloads \
            --clobber
          test -s downloads/POKEGRID-Portable-1.2.0-x64.exe

      - name: Commit LFS binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes downloads/POKEGRID-Portable-1.2.0-x64.exe
          git commit -m "feat: bundle Windows Portable with Git LFS"
          git push origin HEAD:main
