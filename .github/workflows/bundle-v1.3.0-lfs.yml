name: Bundle POKÉGRID 1.3.0 Portable with Git LFS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bundle-v1.3.0-lfs.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git LFS
        run: |
          set -euo pipefail
          git lfs install
          git lfs track "downloads/*.exe"

      - name: Replace bundled Portable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          rm -f downloads/POKEGRID-Portable-1.2.0-x64.exe
          gh release download v1.3.0 \
            --pattern "POKEGRID-Portable-1.3.0-x64.exe" \
            --dir downloads \
            --clobber
          test -s downloads/POKEGRID-Portable-1.3.0-x64.exe

      - name: Commit LFS update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes downloads
          git commit -m "chore: bundle POKÉGRID 1.3.0 Portable"
          git push origin HEAD:main
