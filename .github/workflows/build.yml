name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
      - name: Verify Windows update metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "release/latest.yml")) { throw "latest.yml was not generated" }
      - uses: actions/upload-artifact@v4
        with:
          name: pokegrid-windows
          path: |
            release/POKEGRID-Setup-*.exe
            release/POKEGRID-Portable-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:linux
      - name: Verify Linux update metadata
        run: test -f release/latest-linux.yml
      - uses: actions/upload-artifact@v4
        with:
          name: pokegrid-linux
          path: |
            release/POKEGRID-*.AppImage
            release/latest-linux.yml
            release/*.blockmap
          if-no-files-found: error
